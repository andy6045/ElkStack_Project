input {
  file {
    path => "/usr/share/logstash/data-input/sample-access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "plain"
  }
}

filter {
  # Parse Apache/Nginx combined log format
  grok {
    match => {
      "message" => "%{COMBINEDAPACHELOG}"
    }
  }

  # Parse the timestamp
  date {
    match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # Convert response code and bytes to integers
  mutate {
    convert => {
      "response" => "integer"
      "bytes" => "integer"
    }
  }

  # GeoIP lookup on client IP
  geoip {
    source => "clientip"
    target => "geoip"
  }

  # Parse user agent
  useragent {
    source => "agent"
    target => "user_agent"
  }

  # Add response status category
  if [response] >= 200 and [response] < 300 {
    mutate { add_field => { "response_category" => "Success" } }
  } else if [response] >= 300 and [response] < 400 {
    mutate { add_field => { "response_category" => "Redirect" } }
  } else if [response] >= 400 and [response] < 500 {
    mutate { add_field => { "response_category" => "Client Error" } }
  } else if [response] >= 500 {
    mutate { add_field => { "response_category" => "Server Error" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "web-logs-%{+YYYY.MM.dd}"
  }

  # Also output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
